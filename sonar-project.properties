sonar.projectKey=react-19
sonar.projectName=React 19 App
sonar.sourceEncoding=UTF-8

# Sources
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts,**/*.spec.tsx,**/*.test.tsx

# Couverture (Chemin standard g�n�r� par Vitest)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Exclusions (Calqu� sur ton exemple Angular)
sonar.exclusions=\
  src/main.tsx,\
  src/vite-env.d.ts,\
  **/*.d.ts

# Ne pas compter les tests dans la couverture
sonar.coverage.exclusions=\
  **/*.spec.ts,\
  **/*.test.ts,\
  **/*.spec.tsx,\
  **/*.test.tsx,\
  src/main.tsx

# sonar.qualitygate.wait=true